
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ShopEasy</h1>
        <input type="text" id="search" placeholder="Search products...">
        <div class="cart">🛒 Cart: <span id="count">0</span></div>
    </header>

    <section class="hero">
        <h2>Welcome to ShopEasy</h2>
        <p>Find your favourite products at the best prices!</p>
    </section>

    <main>
        <h2>Our Products</h2>
        <div class="products" id="products"></div>
    </main>

    <section class="cart-section">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items">Your cart is empty.</div>
        <h3>Total: ₹<span id="total">0</span></h3>
        <button onclick="checkout()">Checkout</button>
    </section>

    <footer>
        <p>© 2026 ShopEasy | Online Shopping Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
